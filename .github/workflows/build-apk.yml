name: Build Jarvis APK

# Runs on every push, and from the Actions tab ("Run workflow"). No Android Studio needed: GitHub builds the APK for you.
on:
  push:
    paths-ignore: ['desktop/**', '.github/workflows/build-desktop.yml']   # the PC app has its own build
  workflow_dispatch:
    inputs:
      laptop:
        description: "Build on the laptop's Ubuntu (WSL runner) instead of GitHub's machines"
        type: boolean
        default: false

permissions:
  contents: write   # lets the workflow attach the APK to a Release so you can download it straight onto your phone

jobs:
  build:
    # GitHub's machines (free: the repo is public). Tick "laptop" to use the laptop's Ubuntu (WSL, tools/wsl_runner.sh) instead.
    runs-on: ${{ inputs.laptop && fromJSON('["self-hosted", "Linux", "jarvis-linux"]') || 'ubuntu-latest' }}
    outputs:
      ios: ${{ steps.ioswant.outputs.ios }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.GROQ_API_KEY != '' }}
      HAS_UPLOAD_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The iPhone app is built on GitHub's Mac machines (they cost more), so only when it changed, when the commit message
      # says [ios], or when you press "Run workflow".
      - name: Does the iPhone app need building?
        id: ioswant
        run: |
          want=false
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && want=true
          git log -1 --pretty=%B | grep -qi '\[ios\]' && want=true
          before="${{ github.event.before }}"
          if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null && git diff --name-only "$before" "${{ github.sha }}" | grep -q '^ios/'; then want=true; fi
          echo "ios=$want" >> "$GITHUB_OUTPUT"; echo "iPhone build: $want"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's machines come with the Android SDK; the laptop gets it once (it stays for the next builds)
      - uses: android-actions/setup-android@v3
        if: runner.environment == 'self-hosted'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'   # the old 'tools' package no longer exists

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # three.js (the face) and MapLibre (the map) are packed INTO the app so it works with no CDN.
      - name: Bundle three.js and MapLibre
        run: |
          set -e
          mkdir -p /tmp/vendor && cd /tmp/vendor && npm init -y >/dev/null && npm install three@0.160.0 maplibre-gl@4.7.1 --no-audit --no-fund
          W="$GITHUB_WORKSPACE/app/src/main/assets/www/vendor"
          mkdir -p "$W/three/build" "$W/three/examples" "$W/maplibre"
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js "$W/three/build/" 2>/dev/null || cp node_modules/three/build/three.module.js "$W/three/build/"
          cp -r node_modules/three/examples/jsm "$W/three/examples/jsm"
          find "$W/three/examples/jsm/libs" -type f ! -name 'meshopt_decoder.module.js' ! -name 'ktx-parse.module.js' ! -name 'zstddec.module.js' -delete   # the face scan's texture loader needs these two
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css "$W/maplibre/"
          du -sh "$W"/*

      # The PC's Piper voices run through sherpa-onnx (Apache-2.0). Its ONNX runtime is renamed so it can live next to the
      # one the wake word uses; patchelf rewrites the library names and the check below fails the build if it didn't take.
      - name: Bundle the PC voice engine (sherpa-onnx)
        run: |
          set -e
          V=1.13.8
          curl -sSL -o /tmp/sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-$V.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  /tmp/sherpa.aar" | sha256sum -c -
          sudo apt-get install -y -qq patchelf >/dev/null
          rm -rf /tmp/sh && mkdir -p /tmp/sh && unzip -q -o /tmp/sherpa.aar -d /tmp/sh
          mkdir -p app/libs && cp /tmp/sh/classes.jar app/libs/sherpa-onnx.jar
          for abi in arm64-v8a; do
            d=/tmp/sh/jni/$abi; o=app/src/main/jniLibs/$abi; mkdir -p $o
            cp $d/libonnxruntime.so $o/libonnxruntime_sherpa.so
            patchelf --set-soname libonnxruntime_sherpa.so $o/libonnxruntime_sherpa.so
            cp $d/libsherpa-onnx-jni.so $o/
            patchelf --replace-needed libonnxruntime.so libonnxruntime_sherpa.so $o/libsherpa-onnx-jni.so
            readelf -d $o/libsherpa-onnx-jni.so | grep -q 'libonnxruntime_sherpa.so'
            ! readelf -d $o/libsherpa-onnx-jni.so | grep -q '\[libonnxruntime.so\]'
            ! readelf -V $o/libsherpa-onnx-jni.so | grep -q 'File: libonnxruntime.so '
            readelf -d $o/libonnxruntime_sherpa.so | grep -q 'soname: \[libonnxruntime_sherpa.so\]'
            echo "$abi ok"
          done

      - name: Face recognition (SFace shrunk to 8-bit, checked against the full model)
        run: |
          python3 -m pip install --quiet onnx==1.16.2 onnxruntime==1.19.2 "numpy<2.1" opencv-python-headless==4.10.0.84 scikit-image==0.24.0 2>&1 | tail -3
          set +e
          python3 tools/face_quantize.py models_src/face_recognition_sface.onnx app/src/main/assets/face/yunet.onnx app/src/main/assets/face/sface.onnx > face.log 2>&1
          code=$?
          set -e
          cat face.log
          if [ $code -ne 0 ]; then
            echo "::warning title=Face recognition left out::$(grep -v 'onnxruntime\]' face.log | tail -12 | tr '\n' ' ' | sed 's/%/%25/g' | tail -c 900)"
          fi
          ls -la app/src/main/assets/face/

      - name: Build the phone page from the PC page (if pc_source/ is present)
        run: |
          if [ -f pc_source/index.html ]; then python3 tools/make_www.py; fi

      # ---- No Groq key for users: deploy the Jarvis service (server/worker.js) to Cloudflare with YOUR Groq key,
      #      then build the app pointed at it. Needs three repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GROQ_API_KEY.
      - name: Make the app's access token
        id: token
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          t=$(printf '%s' "jarvis:$GROQ_API_KEY:$GITHUB_REPOSITORY" | sha256sum | cut -c1-40)
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"

      - name: Give the Cloudflare account its free workers.dev address (first time only)
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, secrets, sys, urllib.request, urllib.error
          acct, tok = os.environ['CF_ACCOUNT'].strip(), os.environ['CF_TOKEN'].strip()
          url = f'https://api.cloudflare.com/client/v4/accounts/{acct}/workers/subdomain'
          def call(method, body=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: return e.code, json.load(e)
                  except Exception: return e.code, {}
          st, j = call('GET')
          have = (j.get('result') or {}).get('subdomain') if j.get('success') else None
          if have:
              print(f'workers.dev address already set: {have}.workers.dev'); sys.exit(0)
          owner = os.environ.get('GITHUB_REPOSITORY_OWNER', 'me').lower()
          names = [f'{owner}-jarvis', f'jarvis-{owner}', f'jarvis-{secrets.token_hex(3)}', f'jarvis-{secrets.token_hex(4)}']
          for n in names:
              n = ''.join(c if c.isalnum() or c == '-' else '-' for c in n).strip('-')[:63]
              st, j = call('PUT', {'subdomain': n})
              if j.get('success'):
                  print(f'Registered {n}.workers.dev'); sys.exit(0)
              print(f'{n}: {st} {[e.get("message") for e in j.get("errors", [])]}')
          print('::warning title=Cloudflare workers.dev address::Could not register it automatically. Open dash.cloudflare.com > Workers & Pages once, then run the build again.')
          PY

      - name: Storage for app updates on the Jarvis service (created once)
        id: kv
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true   # without it the app just says it's up to date
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/kv_update.py ensure && echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the Jarvis service to Cloudflare
        id: proxy
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            GROQ_API_KEY
            APP_TOKEN
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_TOKEN: ${{ steps.token.outputs.token }}

      - name: Check the Jarvis service answers like the app will call it
        if: steps.proxy.outputs.deployment-url
        continue-on-error: true
        env:
          BASE: ${{ steps.proxy.outputs.deployment-url }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base, tok = os.environ['BASE'].rstrip('/') + '/v1', os.environ['APP_TOKEN']
          def call(path, body=None, token=tok):
              h = {'x-jarvis-token': token, 'x-jarvis-device': 'build-check-000000000000', 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0 (Linux; Android) Jarvis/1.3'}
              req = urllib.request.Request(base + path, data=json.dumps(body).encode() if body else None, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()
              except Exception as e: return 0, str(e)
          for i in range(12):   # a brand-new workers.dev address can take a minute to come online
              st, body = call('/models')
              if st == 200: break
              print(f'try {i+1}: {st} {body[:120]}'); time.sleep(10)
          ok, why = st == 200, f'models {st}: {body[:200]}'
          if ok:
              ids = [m.get('id') for m in json.loads(body).get('data', [])]
              print('::notice title=Groq models on the Jarvis service::' + ', '.join(sorted(i for i in ids if i)))
              if 'whisper-large-v3-turbo' not in ids: ok, why = False, 'Groq no longer lists whisper-large-v3-turbo (speech to text)'
              st2, b2 = call('/chat/completions', {'model': 'openai/gpt-oss-120b', 'max_tokens': 64, 'reasoning_effort': 'low', 'messages': [{'role': 'user', 'content': 'Say OK.'}]})
              if st2 != 200: ok, why = False, f'chat {st2}: {b2[:200]}'
              print('chat:', st2, b2[:160])
              st3, _ = call('/models', token='wrong'); print('wrong token refused:', st3 == 403)
              sp, _ = call('/ping'); print('ping:', sp)
              if sp != 204: ok, why = False, f'ping {sp}: the app warms its connection with /ping'
              # Can Groq's Qwen model see images? (Jarvis's camera and screen reading need it.) A picture: red left half, blue right half.
              import zlib, struct, base64
              def png(w, h, px):
                  raw = b''.join(b'\x00' + b''.join(bytes(px(x, y)) for x in range(w)) for y in range(h))
                  ch = lambda t, d: struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
                  return b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b'')
              img = 'data:image/png;base64,' + base64.b64encode(png(64, 32, lambda x, y: (220, 20, 20) if x < 32 else (20, 40, 220))).decode()
              for vm in ['qwen/qwen3.8-27b']:
                  sv, bv = call('/chat/completions', {'model': vm, 'max_tokens': 300, 'messages': [{'role': 'user', 'content': [
                      {'type': 'text', 'text': 'What colour is the left half of this picture, and what colour is the right half? Answer in four words.'},
                      {'type': 'image_url', 'image_url': {'url': img}}]}]})
                  try: said = json.loads(bv)['choices'][0]['message'].get('content') or ''
                  except Exception: said = bv[:200]
                  print(f'::notice title=Vision test {vm}::{sv}: ' + ' '.join(str(said).split())[:300].replace('%', '%25'))
          if ok: print('The Jarvis service works: users need no Groq key.')
          else: print('::warning title=Jarvis service check failed::' + ' '.join(why.split()).replace('%', '%25'))
          PY

      - name: Point the app at the Jarvis service (if deployed)
        env:
          API_BASE: ${{ steps.proxy.outputs.deployment-url && format('{0}/v1', steps.proxy.outputs.deployment-url) || secrets.JARVIS_API_BASE }}
          APP_TOKEN: ${{ steps.token.outputs.token || secrets.JARVIS_APP_TOKEN }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          FISH_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          # the Windy webcams key goes in either way (public webcams; never printed)
          python3 -c "import json,os; open('app/src/main/assets/www/local/build_config.js','w').write('export const BUILD = ' + json.dumps({'apiBase': os.environ.get('API_BASE', ''), 'appToken': os.environ.get('APP_TOKEN', ''), 'windyKey': os.environ.get('WINDY_KEY', ''), 'fishKey': os.environ.get('FISH_KEY', '')}) + ';\n')"
          if [ -n "$API_BASE" ]; then
            echo "Built with the Jarvis proxy: users need no Groq key."
          else
            echo "::warning title=This APK still asks for a Groq key::The Jarvis service isn't set up, so users must enter their own Groq key. Add the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GROQ_API_KEY repository secrets (see server/README.md) and run the build again."
          fi

      # The iPhone app uses the very same page and models: hand them to the iPhone job.
      - name: Package the page and models for the iPhone app
        if: steps.ioswant.outputs.ios == 'true'
        run: |
          mkdir -p ios-web && cp -R app/src/main/assets/www ios-web/www
          for d in wake vad face; do cp -R app/src/main/assets/$d ios-web/$d; done
          du -sh ios-web/*

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota mustn't stop the release below
        if: steps.ioswant.outputs.ios == 'true'
        with:
          name: ios-web
          path: ios-web
          retention-days: 3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Check the APK will install (Android's own tools)
        id: apkcheck
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose Jarvis.apk | head -6
          "$BT/zipalign" -c -P 16 4 Jarvis.apk && echo "zipalign OK (16 KB pages)"
          "$BT/aapt2" dump badging Jarvis.apk | grep -E "^package|sdkVersion|native-code"
          BYTES=$(stat -c %s Jarvis.apk)
          echo "mb=$(python3 -c "print(f'{$BYTES/1e6:.1f}')")" >> "$GITHUB_OUTPUT"
          echo "mib=$(python3 -c "print(f'{$BYTES/1048576:.2f}')")" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum Jarvis.apk | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota mustn't stop the release below
        with:
          retention-days: 3
          name: Jarvis-apk
          path: Jarvis.apk

      # ---- Play Store bundle (.aab). Needs one repo secret: UPLOAD_KEY_PASSWORD (any long password you keep).
      #      The first time, the upload key is created with that password and saved to this private repo.
      - name: Play Store bundle
        if: env.HAS_UPLOAD_PASSWORD == 'true'
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          if [ ! -f app/upload.keystore ]; then
            keytool -genkeypair -keystore app/upload.keystore -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$UPLOAD_KEY_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" -dname "CN=Jarvis, O=Jarvis, C=US"
            git config user.name "Jarvis build" && git config user.email "actions@users.noreply.github.com"
            git add app/upload.keystore && git commit -m "Play Store upload key (password is the UPLOAD_KEY_PASSWORD secret)" && git push
          fi
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab Jarvis.aab

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota mustn't stop the release below
        if: env.HAS_UPLOAD_PASSWORD == 'true'
        with:
          retention-days: 3
          name: Jarvis-playstore-aab
          path: Jarvis.aab

      # A Release page is the easiest way to download on the phone: open the repo in the phone's browser > Releases > Jarvis.apk
      # Each build gets its own file name (Jarvis-build-118.apk), so on the phone the newest download is never
      # confused with an old "Jarvis.apk" or a half-finished "Jarvis (2).apk". Older APKs are removed from the page.
      - name: Give this build's APK its own name, remove older ones from the Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Jarvis.apk "Jarvis-build-${GITHUB_RUN_NUMBER}.apk"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.assets[] | select(.name | endswith(".apk")) | .id' 2>/dev/null); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "removed old asset $id"
          done

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis (latest build)
          body: |
            Install **Jarvis-build-${{ github.run_number }}.apk** on your phone (build ${{ github.run_number }}). Built automatically from the latest push.

            **Size: ${{ steps.apkcheck.outputs.mb }} MB** (${{ steps.apkcheck.outputs.bytes }} bytes; some phones show ${{ steps.apkcheck.outputs.mib }} MB).
            If the file on your phone is smaller, the download was cut off: delete it and download again on Wi-Fi.
            Checked with Android's apksigner, zipalign and aapt2. SHA-256 starts ${{ steps.apkcheck.outputs.sha }}.
          files: Jarvis-build-${{ github.run_number }}.apk

      # The app's "Check for updates" downloads from the Jarvis service (the repo is private), so the new APK goes there too
      - name: Put this build on the Jarvis service for in-app updates
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.kv.outputs.ok == 'true' && steps.proxy.outputs.deployment-url
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/kv_update.py upload Jarvis.apk "$GITHUB_RUN_NUMBER"

  # ---- iPhone: the shared engine first (cheap Linux machine), then the app on a Mac
  ios-core:
    needs: build
    if: needs.build.outputs.ios == 'true'
    runs-on: ubuntu-24.04            # setup-swift doesn't know ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Face, wake word and speech detector match the Android versions (swift test)
        run: cd ios/JarvisCore && swift test 2>&1 | tail -40

  ios:
    needs: [build, ios-core]
    if: needs.build.outputs.ios == 'true'
    runs-on: macos-26
    env:
      JARVIS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.g41us.jarvis' }}
      HAS_APPLE: ${{ secrets.APPLE_TEAM_ID != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-web
          path: ios-web

      - name: Put the page and models into the iPhone app
        run: |
          rm -rf ios/Resources && mkdir -p ios/Resources/models
          cp -R ios-web/www ios/Resources/www
          for d in wake vad face; do cp -R ios-web/$d ios/Resources/models/$d; done
          ls ios/Resources/models/*; du -sh ios/Resources/*

      - name: ONNX Runtime from Microsoft's download server (its GitHub repos went missing in November 2026)
        run: |
          set -e; V=1.24.2; cd ios/OnnxRuntime
          for p in c objc; do curl -fsSL --retry 3 -o $p.zip https://download.onnxruntime.ai/pod-archive-onnxruntime-$p-$V.zip; done
          unzip -q -o c.zip 'onnxruntime.xcframework/*' && unzip -q -o objc.zip 'objectivec/*' && rm c.zip objc.zip
          ls; ls onnxruntime.xcframework objectivec/include

      - name: Make the Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
          cd .. && { xcodebuild -project ios/Jarvis.xcodeproj -resolvePackageDependencies -scmProvider system > resolve.log 2>&1 \
            || { sleep 20; xcodebuild -project ios/Jarvis.xcodeproj -resolvePackageDependencies -scmProvider system > resolve.log 2>&1; }; } || { tail -30 resolve.log; echo "::error::$(tail -3 resolve.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          tail -5 resolve.log

      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -project ios/Jarvis.xcodeproj -scheme Jarvis -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > build.log 2>&1 \
            || { grep -E "error:|warning: .*will be an error" build.log | sort -u | head -60; tail -30 build.log;
                 grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g' | cut -c1-900)"; done
                 grep -qE "error:" build.log || echo "::error::$(tail -5 build.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900)"; exit 1; }
          grep -c "warning:" build.log || true
          ls ios/build/Build/Products/Debug-iphonesimulator/

      - name: Run it in the simulator (screenshots and the page's log)
        run: |
          set +e
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; l=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')]; print(l[0]['udid'] if l else '')")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          APP=ios/build/Build/Products/Debug-iphonesimulator/Jarvis.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all "$JARVIS_BUNDLE_ID"
          mkdir -p sim
          xcrun simctl launch --console-pty "$UDID" "$JARVIS_BUNDLE_ID" -JarvisSmokeTest > sim/app.log 2>&1 &
          sleep 9;  xcrun simctl io "$UDID" screenshot sim/1-start.png
          sleep 14; xcrun simctl io "$UDID" screenshot sim/2-after-commands.png
          sleep 6;  xcrun simctl io "$UDID" screenshot sim/3-later.png
          xcrun simctl terminate "$UDID" "$JARVIS_BUNDLE_ID"
          grep -E "\[SMOKE\]|\[PAGE\] (error|warn)|\[JARVIS\]" sim/app.log | head -80
          if grep -q "\[SMOKE\] ready" sim/app.log; then echo "The page started on iPhone."; else echo "::warning title=iPhone smoke test::the page did not report ready (see the sim artifact)"; fi

      # The build log and simulator screenshots, also as files on the "ios-ci" pre-release (handy to look at from anywhere)
      - name: Publish the iPhone build log and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p sim; cp build.log sim/build.log 2>/dev/null; cp archive.log export.log sim/ 2>/dev/null
          (cd sim && zip -q -r ../ios-ci.zip .)
          gh release view ios-ci >/dev/null 2>&1 || gh release create ios-ci --prerelease --title "iPhone build check" --notes "Build log and simulator screenshots from the latest iPhone build. Not an app download."
          gh release upload ios-ci ios-ci.zip --clobber
          true

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota mustn't stop the release below
        if: always()
        with:
          name: Jarvis-iphone-simulator
          path: |
            sim
            build.log
          retention-days: 7

      # ---- An unsigned .ipa on the "ios" release: install it with Sideloadly or AltStore, which sign it with your own Apple ID
      #      (a free Apple ID works; the app then has to be re-signed every 7 days)
      - name: Build the unsigned .ipa (for Sideloadly / AltStore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          xcodebuild -project ios/Jarvis.xcodeproj -scheme Jarvis -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build > device.log 2>&1 \
            || { grep -E "error:" device.log | sort -u | head -40; tail -20 device.log; exit 1; }
          APP=ios/build-device/Build/Products/Release-iphoneos/Jarvis.app
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/ && zip -qry Jarvis.ipa Payload && ls -la Jarvis.ipa
          gh release view ios >/dev/null 2>&1 || gh release create ios --prerelease --title "Jarvis for iPhone (unsigned)" \
            --notes "Install Jarvis.ipa with Sideloadly (Windows/Mac) or AltStore, signed with your Apple ID. With a free Apple ID, re-sign every 7 days."
          gh release upload ios Jarvis.ipa --clobber
          gh release edit ios --notes "Build ${{ github.run_number }} ($(date -u +%Y-%m-%d)). Install Jarvis.ipa with Sideloadly (Windows/Mac) or AltStore, signed with your Apple ID. With a free Apple ID, re-sign every 7 days."
          echo "::notice title=iPhone app::Jarvis.ipa is on the 'ios' release"

      # ---- TestFlight (needs an Apple Developer account; see ios/README.md for the four secrets)
      - name: Sign and send to TestFlight
        if: env.HAS_APPLE == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/Jarvis.xcodeproj -scheme Jarvis -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Jarvis.xcarchive DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -40; tail -20 archive.log; exit 1; }
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Jarvis.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export $AUTH > export.log 2>&1 \
            || { grep -iE "error|no suitable application records" export.log | head -30; tail -20 export.log;
                 echo "::error title=TestFlight upload::If it says no app record: create the app in App Store Connect with bundle ID $JARVIS_BUNDLE_ID (see ios/README.md)"; exit 1; }
          echo "::notice title=Sent to TestFlight::Build ${{ github.run_number }} is processing in App Store Connect (about 10-30 minutes)."
