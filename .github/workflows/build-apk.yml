name: Build Jarvis APK

# Runs on every push, and from the Actions tab ("Run workflow"). No Android Studio needed: GitHub builds the APK for you.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow attach the APK to a Release so you can download it straight onto your phone

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.GROQ_API_KEY != '' }}
      HAS_UPLOAD_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # three.js (the face) and MapLibre (the map) are packed INTO the app so it works with no CDN.
      - name: Bundle three.js and MapLibre
        run: |
          set -e
          mkdir -p /tmp/vendor && cd /tmp/vendor && npm init -y >/dev/null && npm install three@0.160.0 maplibre-gl@4.7.1 --no-audit --no-fund
          W="$GITHUB_WORKSPACE/app/src/main/assets/www/vendor"
          mkdir -p "$W/three/build" "$W/three/examples" "$W/maplibre"
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js "$W/three/build/" 2>/dev/null || cp node_modules/three/build/three.module.js "$W/three/build/"
          cp -r node_modules/three/examples/jsm "$W/three/examples/jsm"
          find "$W/three/examples/jsm/libs" -type f ! -name 'meshopt_decoder.module.js' -delete
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css "$W/maplibre/"
          du -sh "$W"/*

      # The PC's Piper voices run through sherpa-onnx (Apache-2.0). Its ONNX runtime is renamed so it can live next to the
      # one the wake word uses; patchelf rewrites the library names and the check below fails the build if it didn't take.
      - name: Bundle the PC voice engine (sherpa-onnx)
        run: |
          set -e
          V=1.13.8
          curl -sSL -o /tmp/sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-$V.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  /tmp/sherpa.aar" | sha256sum -c -
          sudo apt-get install -y -qq patchelf >/dev/null
          rm -rf /tmp/sh && mkdir -p /tmp/sh && unzip -q -o /tmp/sherpa.aar -d /tmp/sh
          mkdir -p app/libs && cp /tmp/sh/classes.jar app/libs/sherpa-onnx.jar
          for abi in arm64-v8a; do
            d=/tmp/sh/jni/$abi; o=app/src/main/jniLibs/$abi; mkdir -p $o
            cp $d/libonnxruntime.so $o/libonnxruntime_sherpa.so
            patchelf --set-soname libonnxruntime_sherpa.so $o/libonnxruntime_sherpa.so
            cp $d/libsherpa-onnx-jni.so $o/
            patchelf --replace-needed libonnxruntime.so libonnxruntime_sherpa.so $o/libsherpa-onnx-jni.so
            readelf -d $o/libsherpa-onnx-jni.so | grep -q 'libonnxruntime_sherpa.so'
            ! readelf -d $o/libsherpa-onnx-jni.so | grep -q '\[libonnxruntime.so\]'
            ! readelf -V $o/libsherpa-onnx-jni.so | grep -q 'File: libonnxruntime.so '
            readelf -d $o/libonnxruntime_sherpa.so | grep -q 'soname: \[libonnxruntime_sherpa.so\]'
            echo "$abi ok"
          done

      - name: Build the phone page from the PC page (if pc_source/ is present)
        run: |
          if [ -f pc_source/index.html ]; then python3 tools/make_www.py; fi

      - name: Check the Adam model is included
        run: |
          if [ -f app/src/main/assets/www/models/adam.glb ]; then echo "adam.glb found"; else echo "::warning::models/adam.glb is not in the repo - Jarvis will use the online face instead. See README step 3."; fi

      # ---- No Groq key for users: deploy the Jarvis service (server/worker.js) to Cloudflare with YOUR Groq key,
      #      then build the app pointed at it. Needs three repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GROQ_API_KEY.
      - name: Make the app's access token
        id: token
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          t=$(printf '%s' "jarvis:$GROQ_API_KEY:$GITHUB_REPOSITORY" | sha256sum | cut -c1-40)
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"

      - name: Deploy the Jarvis service to Cloudflare
        id: proxy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            GROQ_API_KEY
            APP_TOKEN
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_TOKEN: ${{ steps.token.outputs.token }}

      - name: Point the app at the Jarvis service (if deployed)
        env:
          API_BASE: ${{ steps.proxy.outputs.deployment-url && format('{0}/v1', steps.proxy.outputs.deployment-url) || secrets.JARVIS_API_BASE }}
          APP_TOKEN: ${{ steps.token.outputs.token || secrets.JARVIS_APP_TOKEN }}
        run: |
          if [ -n "$API_BASE" ]; then
            python3 -c "import json,os; open('app/src/main/assets/www/local/build_config.js','w').write('export const BUILD = ' + json.dumps({'apiBase': os.environ['API_BASE'], 'appToken': os.environ.get('APP_TOKEN', '')}) + ';\n')"
            echo "Built with the Jarvis proxy: users need no Groq key."
          else
            echo "No JARVIS_API_BASE secret: each user enters their own Groq key."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      # ---- Play Store bundle (.aab). Needs one repo secret: UPLOAD_KEY_PASSWORD (any long password you keep).
      #      The first time, the upload key is created with that password and saved to this private repo.
      - name: Play Store bundle
        if: env.HAS_UPLOAD_PASSWORD == 'true'
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          if [ ! -f app/upload.keystore ]; then
            keytool -genkeypair -keystore app/upload.keystore -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$UPLOAD_KEY_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" -dname "CN=Jarvis, O=Jarvis, C=US"
            git config user.name "Jarvis build" && git config user.email "actions@users.noreply.github.com"
            git add app/upload.keystore && git commit -m "Play Store upload key (password is the UPLOAD_KEY_PASSWORD secret)" && git push
          fi
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab Jarvis.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_PASSWORD == 'true'
        with:
          name: Jarvis-playstore-aab
          path: Jarvis.aab

      # A Release page is the easiest way to download on the phone: open the repo in the phone's browser > Releases > Jarvis.apk
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis (latest build)
          body: Install Jarvis.apk on your phone. Built automatically from the latest push.
          files: Jarvis.apk
