name: Build Jarvis desktop (Windows + Mac)

# Started by hand (Actions tab > Build Jarvis desktop > Run workflow), never on push.
# Windows builds on YOUR LAPTOP by default (a self-hosted runner, label "jarvis-laptop"): free and unlimited, as long as the laptop
# is on. Tick "cloud" to use GitHub's Windows machine instead, "mac" for a Mac build (GitHub's Mac machines count 10x against a
# private repo's 2,000 free minutes a month). Each build puts its installer straight onto the downloads page: RELEASE_REPO
# (variable) + RELEASE_TOKEN (secret), see desktop/README.md. The steps are Python so the laptop needs nothing but the runner.
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Build Windows on GitHub's machine instead of my laptop (uses free minutes)"
        type: boolean
        default: false
      mac:
        description: 'Also build for Mac (Intel build, runs on every Mac; ~100 free minutes)'
        type: boolean
        default: false
      mac_arm:
        description: 'Also a native Apple Silicon build (another ~100 minutes; GitHub often has no machine free)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  JARVIS_VERSION: 1.0.${{ github.run_number }}
  PYTHONIOENCODING: utf-8          # the laptop's console encoding (cp1252) can't print everything in Jarvis's log
  PYTHONUNBUFFERED: '1'            # print as it happens: a step that dies mid-upload used to leave no log at all
  REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["{0}"{1}{2}]', inputs.cloud && 'windows-latest' || 'laptop', inputs.mac && ',"macos-15-intel"' || '', inputs.mac_arm && ',"macos-latest"' || '')) }}
    runs-on: ${{ matrix.os == 'laptop' && fromJSON('["self-hosted", "Windows", "jarvis-laptop"]') || matrix.os }}
    timeout-minutes: 180          # a slow line: the upload alone can take most of an hour, and once more after a drop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.os != 'laptop'
        with:
          python-version: '3.13'

      # On the laptop: Python's ready-made package from NuGet, just unzipped (setup-python's installer needs administrator
      # rights, and the runner service deliberately runs as a limited account). Fetched once, kept in the runner's tool folder.
      - name: Python (laptop)
        if: matrix.os == 'laptop'
        shell: cmd
        run: |
          set PY=%RUNNER_TOOL_CACHE%\python-3.13.17
          if not exist "%PY%\tools\python.exe" (
            curl -sSL -o "%RUNNER_TEMP%\python.zip" https://www.nuget.org/api/v2/package/python/3.13.17 || exit /b 1
            mkdir "%PY%"
            tar -xf "%RUNNER_TEMP%\python.zip" -C "%PY%" || exit /b 1
          )
          echo %PY%\tools>>"%GITHUB_PATH%"
          echo %PY%\tools\Scripts>>"%GITHUB_PATH%"
          "%PY%\tools\python.exe" --version

      - name: Version and built-in keys (Google sign-in, webcams, Spotify)
        shell: python
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          FISH_KEY: ${{ secrets.FISH_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          import json, os
          open("desktop/app/VERSION", "w").write(os.environ["JARVIS_VERSION"])
          open("desktop/app/UPDATE_REPO", "w").write(os.environ["REPO"])
          c = os.environ.get("GOOGLE_OAUTH_CLIENT", "")
          if c:
              open("desktop/app/google_client.json", "w").write(c)
              print("Google client:", list(json.loads(c)))
          else:
              print("No GOOGLE_OAUTH_CLIENT secret: Sign in with Google is left out")
          w = os.environ.get("WINDY_KEY", "").strip()
          if w: open("desktop/app/windy_key", "w").write(w); print("Windy webcams: key built in")
          else: print("No WINDY_KEY secret: webcams are left out")
          f = os.environ.get("FISH_KEY", "").strip()
          if f: open("desktop/app/fish_key", "w").write(f); print("Fish Audio: key built in (characters' voices)")
          else: print("No FISH_API_KEY secret: characters need the user's own Fish Audio key")
          sid, ssec = os.environ.get("SPOTIFY_CLIENT_ID", "").strip(), os.environ.get("SPOTIFY_CLIENT_SECRET", "").strip()
          if sid and ssec: json.dump({"id": sid, "secret": ssec}, open("desktop/app/spotify_client.json", "w")); print("Spotify: app keys built in")
          else: print("No SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET secrets: Spotify is left out")

      - name: Microphone library (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install portaudio
          echo "CFLAGS=-I$(brew --prefix portaudio)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix portaudio)/lib" >> $GITHUB_ENV

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/app/requirements.txt pyinstaller
          python -c "import openwakeword.utils as u; f = getattr(u, 'download_models', None); f and f()"

      - name: Package
        run: python -m PyInstaller desktop/jarvis.spec --noconfirm --distpath dist --workpath build

      - name: Check it starts
        shell: python
        env:
          JARVIS_NO_WINDOW: '1'
          JARVIS_PORT: '8010'           # not 8000: on the laptop, the Jarvis you use may be running
          JARVIS_HOME: ${{ runner.temp }}/jarvis-home
        run: |
          import os, subprocess, sys, time, urllib.request
          exe = os.path.abspath("dist/Jarvis/Jarvis.exe" if sys.platform == "win32" else "dist/Jarvis.app/Contents/MacOS/Jarvis")
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          ok = False
          try:
              proc = subprocess.Popen([exe])
              for _ in range(120):
                  try: print(urllib.request.urlopen("http://127.0.0.1:8010/setup/status", timeout=3).read().decode()); ok = True; break
                  except Exception: time.sleep(3)
              home = os.environ["JARVIS_HOME"]
              time.sleep(8)                          # the floating head starts alongside: give it time to fail if it's going to
              for log in ("jarvis.log", "wake.log", "head.log"):
                  p = os.path.join(home, log)
                  if os.path.exists(p):
                      text = open(p, encoding="utf-8", errors="replace").read()
                      print(f"---- {log}"); print("".join(text.splitlines(True)[-50:]))
                      if log == "head.log" and ("couldn't start" in text or "Traceback" in text): print("FAILED: the floating head can't start"); ok = False
          finally:   # stop only this test copy (and its listener), never the Jarvis he is using, even if the check itself failed
              if sys.platform == "win32":
                  subprocess.run(["powershell", "-NoProfile", "-Command",
                                  f"Get-Process Jarvis -ErrorAction SilentlyContinue | Where-Object {{ $_.Path -eq '{exe}' }} | Stop-Process -Force"])
              else:
                  subprocess.run(["pkill", "-f", exe])
              time.sleep(3)
          sys.exit(0 if ok else 1)

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: python
        run: |
          import io, os, subprocess, urllib.request, zipfile
          cached = os.path.join(os.environ["RUNNER_TOOL_CACHE"], "innosetup-6.7.3")
          iscc = next((p for p in [os.path.join(os.environ.get("ProgramFiles(x86)", ""), "Inno Setup 6", "ISCC.exe"),
                                   os.path.join(cached, "tools", "ISCC.exe")] if os.path.exists(p)), None)
          if not iscc:   # first build on the laptop: Inno Setup's ready-made package (NuGet zip), no installer to run, kept for next time
              data = urllib.request.urlopen("https://www.nuget.org/api/v2/package/Tools.InnoSetup/6.7.3", timeout=120).read()
              zipfile.ZipFile(io.BytesIO(data)).extractall(cached)
              iscc = os.path.join(cached, "tools", "ISCC.exe")
          print("Inno Setup:", iscc)
          subprocess.run([iscc, r"desktop\installer.iss"], check=True)
          # what takes the room: the installer's size and the biggest parts of the app (to keep the upload small)
          print(f"Installer: {os.path.getsize('dist/Jarvis-Setup.exe') / 1048576:.0f} MB")
          sizes = {}
          for root, _, files in os.walk("dist/Jarvis/_internal"):
              top = os.path.relpath(root, "dist/Jarvis/_internal").split(os.sep)[0]
              for f in files: sizes[top if top != "." else f] = sizes.get(top if top != "." else f, 0) + os.path.getsize(os.path.join(root, f))
          for k, v in sorted(sizes.items(), key=lambda kv: -kv[1])[:25]: print(f"  {v / 1048576:7.1f} MB  {k}")

      - name: Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name=$([ "$(uname -m)" = arm64 ] && echo Jarvis-Mac-AppleSilicon || echo Jarvis-Mac-Intel)
          mkdir dmg && cp -R dist/Jarvis.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Jarvis -srcfolder dmg -ov -format UDZO "dist/$name.dmg"

      # Straight onto the downloads page (no artifact storage: a private repo's is tiny). Python + the GitHub API, so the laptop
      # doesn't need the gh tool. The first build to finish creates the release; the others add their file to it.
      - name: Publish
        shell: python
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          UPLOAD_MBIT: ${{ vars.UPLOAD_MBIT }}
        run: |
          import glob, os, time, requests
          repo, tag, ver = os.environ["REPO"], "desktop-v" + os.environ["JARVIS_VERSION"], os.environ["JARVIS_VERSION"]
          H = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          files = glob.glob("dist/Jarvis-Setup.exe") + glob.glob("dist/*.dmg")
          if not files: raise SystemExit("Nothing was built.")
          notes = ("Windows: download Jarvis-Setup.exe and run it. If Windows says it protected your PC, press More info, then Run anyway.\n"
                   "Mac: Jarvis-Mac-Intel.dmg works on every Mac (Jarvis-Mac-AppleSilicon.dmg, when there is one, is faster on M1 and newer). "
                   "Open it and drag Jarvis into Applications. The first time, open it, then System Settings > Privacy & Security > Open Anyway.\n"
                   "On first start Jarvis asks for a free Groq key and downloads his voice (about 400 MB, once).")
          def call(method, url, **k):      # the laptop's internet drops now and then: wait for it rather than fail the whole build
              for attempt in range(12):
                  try: return requests.request(method, url, headers={**H, **k.pop("headers", {})}, **k)
                  except requests.RequestException as e:
                      print(f"{method} {url.split('/repos/')[-1]}: {type(e).__name__}, trying again in 30 s"); time.sleep(30)
                      if "data" in k and hasattr(k["data"], "seek"): k["data"].seek(0)
              raise SystemExit("No internet connection for 6 minutes.")
          # a new release is a draft until its files are on it, so the downloads page and the Update button never see an empty one
          rel = next((x for x in call("GET", f"https://api.github.com/repos/{repo}/releases?per_page=20", timeout=30).json() if x.get("tag_name") == tag), None)
          if not rel:
              r = call("POST", f"https://api.github.com/repos/{repo}/releases", timeout=30,
                       json={"tag_name": tag, "name": f"Jarvis {ver}", "body": notes, "draft": True})
              if r.status_code != 201: raise SystemExit(f"Couldn't create the release: {r.status_code} {r.text[:200]}")
              rel = r.json()
          for f in files:
              name = os.path.basename(f)
              for old in rel.get("assets", []):
                  if old["name"] == name: call("DELETE", old["url"], timeout=30)
              size = os.path.getsize(f); print(f"uploading {name}: {size / 1048576:.0f} MB")
              # The laptop's upload is slow: sent flat out, it filled the line so completely that the runner's own check-ins with GitHub
              # couldn't get through, and GitHub dropped the job ("runner lost communication") mid-upload. So: two minutes flat out to
              # measure the line, then 65% of that, leaving room for everything else. UPLOAD_MBIT (a repo variable) sets it by hand.
              fixed = float(os.environ.get("UPLOAD_MBIT") or 0) * 1e6 / 8
              class Progress:          # paced as above, with a line every 10% so a slow or stuck upload shows in the log
                  def __init__(self, fh): self.fh = fh; self.seek(0)
                  def read(self, n=-1):
                      b = self.fh.read(256 << 10 if n is None or n < 0 else min(n, 256 << 10)); self.sent += len(b)
                      now = time.time(); el = now - self.t0
                      if not self.cap and (fixed or el > 120):
                          self.cap = fixed or 0.65 * self.sent / el; self.c0, self.ct = self.sent, now
                          print(f"  line measured at {self.sent / el * 8 / 1e6:.2f} Mbit/s: sending at {self.cap * 8 / 1e6:.2f} Mbit/s")
                      if self.cap:
                          ahead = (self.sent - self.c0) / self.cap - (now - self.ct)
                          if ahead > 0: time.sleep(ahead)
                      if self.sent >= size * self.mark:
                          print(f"  {self.mark:.0%} after {(time.time() - self.t0) / 60:.1f} min"); self.mark += 0.1
                      return b
                  def seek(self, *a):
                      self.sent, self.mark, self.t0, self.cap = 0, 0.1, time.time(), 0
                      return self.fh.seek(*a) if a else None
                  def __len__(self): return size
              for attempt in range(3):
                  with open(f, "rb") as raw:
                      fh = Progress(raw)
                      r = call("POST", f"https://uploads.github.com/repos/{repo}/releases/{rel['id']}/assets", params={"name": name},
                               headers={"Content-Type": "application/octet-stream"}, data=fh, timeout=3600)   # a slow line takes 25+ min
                  if r.status_code == 201: print("uploaded", name); break
                  print("upload", name, r.status_code, r.text[:200]); time.sleep(10)
              else: raise SystemExit(f"Couldn't upload {name}.")
          r = call("PATCH", f"https://api.github.com/repos/{repo}/releases/{rel['id']}", timeout=30, json={"draft": False, "make_latest": "true"})
          if r.status_code != 200: raise SystemExit(f"Couldn't publish the release: {r.status_code} {r.text[:200]}")
          print(f"https://github.com/{repo}/releases/tag/{tag}")
