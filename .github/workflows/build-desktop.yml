name: Build Jarvis desktop (Windows + Mac)

# Runs when anything in desktop/ changes, or from the Actions tab ("Run workflow").
# Makes Jarvis-Setup.exe (Windows) and Jarvis.dmg (Mac, Apple Silicon) and puts them on a Release.
# Releases of a private repo can only be downloaded by you. To share with anyone, make a PUBLIC repo for downloads,
# then add the repo name as the Actions variable RELEASE_REPO (e.g. ghost-apps/downloads) and a token that can
# write to it as the secret RELEASE_TOKEN. See desktop/README.md.
# Only when started by hand (Actions tab > Run workflow, or the API): every build used to run on each push, and Mac machines count
# 10x against a private repo's free 2,000 minutes a month (one full build was ~250 of them). Windows only by default.
on:
  workflow_dispatch:
    inputs:
      mac:
        description: 'Also build for Mac (Intel build, runs on every Mac; costs ~100 free minutes)'
        type: boolean
        default: false
      mac_arm:
        description: 'Also a native Apple Silicon build (another ~100 minutes, and GitHub often has no machine free)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  JARVIS_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["windows-latest"{0}{1}]', inputs.mac && ',"macos-15-intel"' || '', inputs.mac_arm && ',"macos-latest"' || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Version
        shell: bash
        run: |
          echo "$JARVIS_VERSION" > desktop/app/VERSION
          echo "${{ vars.RELEASE_REPO || github.repository }}" > desktop/app/UPDATE_REPO

      - name: Google sign-in client
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT" ]; then printf '%s' "$GOOGLE_OAUTH_CLIENT" > desktop/app/google_client.json && python -c "import json; c = json.load(open('desktop/app/google_client.json')); print('Google client:', list(c))"; else echo "No GOOGLE_OAUTH_CLIENT secret: Sign in with Google is left out"; fi

      - name: Microphone library (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio
          echo "CFLAGS=-I$(brew --prefix portaudio)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix portaudio)/lib" >> $GITHUB_ENV

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/app/requirements.txt pyinstaller

      - name: Package
        run: pyinstaller desktop/jarvis.spec --noconfirm --distpath dist --workpath build

      - name: Check it starts
        shell: bash
        env:
          JARVIS_NO_WINDOW: '1'
          JARVIS_HOME: ${{ runner.temp }}/jarvis-home
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./dist/Jarvis/Jarvis.exe & else ./dist/Jarvis.app/Contents/MacOS/Jarvis & fi
          ok=0
          for i in $(seq 1 120); do curl -fs http://127.0.0.1:8000/setup/status && ok=1 && break; sleep 3; done
          echo; echo "---- jarvis.log"; tail -n 60 "$JARVIS_HOME/jarvis.log" || true
          echo "---- wake.log"; tail -n 20 "$JARVIS_HOME/wake.log" || true
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM Jarvis.exe || true; else pkill -f Contents/MacOS/Jarvis || true; fi
          sleep 3
          [ "$ok" = 1 ]

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc desktop\installer.iss

      - name: Mac disk image
        if: runner.os == 'macOS'
        run: |
          name=$([ "$(uname -m)" = arm64 ] && echo Jarvis-Mac-AppleSilicon || echo Jarvis-Mac-Intel)
          mkdir dmg && cp -R dist/Jarvis.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Jarvis -srcfolder dmg -ov -format UDZO "dist/$name.dmg"

      # Straight onto the downloads page from here: handing 230 MB installers to a separate job went through GitHub's artifact
      # storage, which is tiny for a private repo and filled up ("BlobNotFound"). Each build adds its own file to the release.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          TAG="desktop-v$JARVIS_VERSION"
          files=$(ls dist/Jarvis-Setup.exe dist/*.dmg 2>/dev/null) || true
          [ -n "$files" ] || { echo "Nothing was built."; exit 1; }
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --latest --title "Jarvis $JARVIS_VERSION" --notes "Windows: download Jarvis-Setup.exe and run it. If Windows says it protected your PC, press More info, then Run anyway.
          Mac: Jarvis-Mac-Intel.dmg works on every Mac (Jarvis-Mac-AppleSilicon.dmg, when there is one, is faster on M1 and newer). Open it and drag Jarvis into Applications. The first time, open it, then go to System Settings > Privacy & Security and press Open Anyway.
          On first start Jarvis asks for a free Groq key and downloads his voice (about 400 MB, once)." || sleep 5   # two builds may race to create it
          fi
          for f in $files; do
            for try in 1 2 3; do gh release upload "$TAG" "$f" --repo "$REPO" --clobber && break; sleep 10; done
          done
          echo "https://github.com/$REPO/releases/tag/$TAG"
