name: Publish a prebuilt APK for in-app updates

# While GitHub's own machines can't run (billing), the APK is built elsewhere, pushed to the apk-drop branch, and the
# laptop puts it on the Jarvis service so the app's Update button finds it. build = the APK's versionCode minus 100.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number inside the APK (versionCode - 100)"
        required: true

jobs:
  publish:
    runs-on: [self-hosted, Windows, jarvis-laptop]
    steps:
      - uses: actions/checkout@v4
      - name: Take the APK from the apk-drop branch
        run: |
          git fetch --depth 1 origin apk-drop
          git checkout FETCH_HEAD -- Jarvis.apk
          (Get-Item Jarvis.apk).Length
      - name: Put it on the Jarvis service
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/kv_update.py upload Jarvis.apk ${{ inputs.build }}
