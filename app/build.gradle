plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 36

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 36
        // every GitHub build gets a higher number, which the Play Store requires for each upload
        versionCode 100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName "1.3"
        ndk {
            abiFilters 'arm64-v8a'                    // 64-bit phones (every current Android phone); keeps the APK small
        }
    }

    // A fixed signing key, so every new build installs OVER the old one and keeps your settings.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Play Store upload key: created once by the build workflow (needs the UPLOAD_KEY_PASSWORD repo secret)
        release {
            storeFile file('upload.keystore')
            storePassword System.getenv('UPLOAD_KEY_PASSWORD') ?: ''
            keyAlias 'upload'
            keyPassword System.getenv('UPLOAD_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 3D models are already compressed; storing them as-is keeps the APK fast to open.
    androidResources {
        noCompress 'glb', 'gltf', 'png', 'ktx2', 'onnx'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'   // runs the "Hey Jarvis" wake word on the phone
    // The PC's Piper voices (Alan / Amy) through sherpa-onnx. The build workflow puts its classes in libs/ and its
    // native libraries (with their runtime renamed so it can't clash with the one above) in src/main/jniLibs/.
    implementation files('libs/sherpa-onnx.jar')
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.apache.commons:commons-compress:1.26.1'               // unpacks the downloaded voices
}
