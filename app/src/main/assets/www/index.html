<style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

console.log('[JARVIS] v24 — speech-only, fast speech queue, quiet-voice friendly');

const TTS_RATE = 1.22, TTS_PITCH = 1.0;
const AVATAR_FEMALE = 'models/faces/nova.glb';
const AVATAR_MALE = 'models/faces/kofi.glb';
const FADE_OUT_RATE = 5.0, FADE_IN_RATE = 3.0;

const container = document.getElementById('three');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.JARVIS_NATIVE ? ((navigator.deviceMemory || 4) <= 4 ? 1 : 1.25) : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.localClippingEnabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
const CAM_LOOK = new THREE.Vector3(0, 4.4, 0);
const CAM_BASE = new THREE.Vector3(0, 4.4, 1.8);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_LOOK);

// phone: pull the camera back on tall, narrow screens so the whole face fits (added by make_www.py)
let camFit = 1;
function fitCamera() {
  const a = window.innerWidth / Math.max(1, window.innerHeight);
  camFit = a >= 1 ? 1 : Math.min(3.2, Math.max(1, (0.85 / (0.4663 * a)) / CAM_BASE.z));
}
fitCamera();

window.addEventListener('resize', () => {
  fitCamera();
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

let mouseNormX = 0, mouseNormY = 0;
window.addEventListener('mousemove', (e) => {
  mouseNormX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNormY = -(e.clientY / window.innerHeight) * 2 + 1;
});

const hud = new THREE.Group(); scene.add(hud);
function makeGlowTexture(size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.1)'); g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = makeGlowTexture();
const flareTex = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 32; const g = c.getContext('2d');
  const h = g.createLinearGradient(0, 0, 256, 0); h.addColorStop(0, 'rgba(255,200,120,0)'); h.addColorStop(0.5, 'rgba(255,240,210,1)'); h.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = h; g.fillRect(0, 15, 256, 2); return new THREE.CanvasTexture(c); })();
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.2); keyLight.position.set(3, 7, 6); scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xbcd4ff, 0.9); fillLight.position.set(-4, 5, 5); scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xddeaff, 1.5); rimLight.position.set(-2, 6, -6); scene.add(rimLight);
const bounceLight = new THREE.DirectionalLight(0x8899aa, 0.35); bounceLight.position.set(2, -1, -3); scene.add(bounceLight);

const CLIP_Y = 3.9;
const bodyClipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -CLIP_Y);
const faceGroup = new THREE.Group(); hud.add(faceGroup);

const sharedUniforms = {
  uTime: { value: 0 }, uColor: { value: new THREE.Color(0x0099dd) },
  uAccent: { value: new THREE.Color(0x78d0f0) }, uOpacity: { value: 0.95 },
  uSpeaking: { value: 0.0 }, uMouthY: { value: 0.44 }, uMouthX: { value: 0.50 },
};
const GID_VERT = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const GID_FRAG = `
uniform sampler2D uTex; uniform float uTime; uniform vec3 uColor; uniform vec3 uAccent;
uniform float uOpacity; uniform float uSpeaking; uniform float uMouthY; uniform float uMouthX;
varying vec2 vUv;
void main() {
  vec2 mouthUV = vec2(uMouthX, uMouthY); vec2 d = (vUv - mouthUV); d.x *= 1.5;
  float mouthMask = smoothstep(0.20, 0.05, length(d)) * uSpeaking;
  float lipOpen = ((sin(uTime * 17.0) * 0.5 + 0.5) * 0.7 + (sin(uTime * 23.0 + 1.7) * 0.5 + 0.5) * 0.3) * 0.028 * mouthMask;
  vec2 uv = vUv; uv.y -= lipOpen * mouthMask;
  vec4 tex = texture2D(uTex, uv);
  if (tex.a < 0.04) discard;
  float lum = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
  float shaped = pow(smoothstep(0.18, 0.92, lum), 0.85);
  vec3 tint = uColor * shaped;
  tint = mix(tint, uAccent, smoothstep(0.88, 1.0, lum) * 0.4);
  tint += uAccent * mouthMask * 0.4;
  gl_FragColor = vec4(tint, tex.a * uOpacity * (0.72 + shaped * 0.28));
}`;
const gidMat = new THREE.ShaderMaterial({ uniforms: { ...sharedUniforms, uTex: { value: null } },
  vertexShader: GID_VERT, fragmentShader: GID_FRAG, transparent: true,
  blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide });
const gidPlane = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), gidMat);
gidPlane.position.y = -0.3; faceGroup.add(gidPlane);
new THREE.TextureLoader().load('models/gideon.png', (t) => {
  t.colorSpace = THREE.SRGBColorSpace; gidMat.uniforms.uTex.value = t;
}, undefined, () => {});

const avatarLoader = new GLTFLoader();
avatarLoader.setMeshoptDecoder(MeshoptDecoder);
let avatarModel = null;
const mouthMorphs = {};
let jawBone = null, jawBoneRestQuat = null;
let currentAvatarUrl = null, avatarLoadToken = 0;
let avatarAlpha = 1, pendingSwapUrl = null;

const MOUTH_MORPH_NAMES = ['jawOpen','mouthOpen','mouthClose','viseme_sil','viseme_PP','viseme_FF','viseme_TH','viseme_DD','viseme_kk','viseme_CH','viseme_SS','viseme_nn','viseme_RR','viseme_aa','viseme_E','viseme_I','viseme_O','viseme_U','A','I','U','E','O','aa','ih','ou','ee','oh','MouthOpen','Mouth_A','Mouth_I','Mouth_U','Mouth_E','Mouth_O','mouth_open'];

function disposeAvatar(model) {
  if (!model) return;
  model.traverse((c) => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => {
        for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
        m.dispose && m.dispose();
      });
    }
  });
}
let particleFaceMaterial = null, particleFx = null;   // particleFx: the sparkles, orbiting dust and light streaks around the face
function applyAvatarAlpha(a) {
  if (!avatarModel) return;
  const wantsAlpha = a < 0.995;
  avatarModel.traverse((c) => {
    if (!c.material) return;
    const mats = Array.isArray(c.material) ? c.material : [c.material];
    mats.forEach(m => {
      if (m.userData._baseOpacity === undefined) {
        m.userData._baseOpacity = (m.opacity !== undefined) ? m.opacity : 1;
        m.userData._baseTransparent = m.transparent === true;
      }
      m.opacity = m.userData._baseOpacity * a;
      const t = wantsAlpha || m.userData._baseTransparent;
      if (m.transparent !== t) { m.transparent = t; m.needsUpdate = true; }
    });
  });
  if (avatarModel.userData._baseScale !== undefined) {
    avatarModel.scale.setScalar(avatarModel.userData._baseScale * (0.90 + 0.10 * a));
  }
}
// Turn the loaded head surface into a dense, glowing gold point cloud, matching the JARVIS particle-face reference.
function makeGoldenParticleFace(model) {
  const candidates = [], cumulative = [];
  const invRoot = new THREE.Matrix4();
  model.updateMatrixWorld(true);

async function grabWebcamFrame(width = 640, height = 480) {
  let tries = 0;
  while (_camBusy && tries < 30) {
    await new Promise(r => setTimeout(r, 100));
    tries++;
  }
  _camBusy = true;
  _setCamIndicator(true);
  let stream = null;
  let video = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width, height, facingMode: 'user' }, audio: false,
    });
    video = document.createElement('video');
    video.srcObject = stream;
    video.muted = true; video.playsInline = true; video.autoplay = true;
    video.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0.01;pointer-events:none;';
    document.body.appendChild(video);
    try { await video.play(); } catch (e) {}
    const startWait = Date.now();
    while (video.readyState < 2 && Date.now() - startWait < 5000) {
      await new Promise(r => setTimeout(r, 50));
    }
    if (video.readyState < 2) {
      console.warn('[CAM] readyState stuck at', video.readyState);
    }
    await new Promise(r => setTimeout(r, 700));
    const cw = video.videoWidth || width;
    const ch = video.videoHeight || height;
    console.log(`[CAM] capturing ${cw}x${ch} (readyState=${video.readyState})`);
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    canvas.getContext('2d').drawImage(video, 0, 0, cw, ch);
    const data = canvas.toDataURL('image/jpeg', 0.85);
    console.log(`[CAM] frame size: ${data.length} bytes`);
    return data;
  } catch (e) {
    console.warn('[CAM] grab failed', e);
    return null;
  } finally {
    try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { if (video) { video.pause(); video.srcObject = null; video.remove(); } } catch (e) {}
    _camBusy = false;
    _setCamIndicator(false);
  }
}

async function setupAudioCapture(stream) {
  if (audioCaptureReady) return;
  try {
    audioCaptureCtx = new AudioContext({ sampleRate: 16000 });
    const src = audioCaptureCtx.createMediaStreamSource(stream);
    const proc = audioCaptureCtx.createScriptProcessor(2048, 1, 1);
    const mute = audioCaptureCtx.createGain(); mute.gain.value = 0;
    proc.connect(mute); mute.connect(audioCaptureCtx.destination); src.connect(proc);

    let bargeinStreak = 0;
    proc.onaudioprocess = (e) => {
      if (muted) return;   // stream mic to Whisper even while idle so 'Hey Jarvis' is heard by the browser too
      if (!audioWs || audioWs.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);

      if (speaking) {
        if (guideSpeaking) return;          // road noise must not cut off turn-by-turn prompts; the wake word still does
        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        const rms = Math.sqrt(sum / input.length) * 32768;
        if (rms > BARGE_RMS) {
          bargeinStreak++;
          if (bargeinStreak >= BARGE_FRAMES) {
            beep(1200, 0.08);
            cancelAllSpeech();
            bargeinStreak = 0;
          }
        } else {
          bargeinStreak = Math.max(0, bargeinStreak - 1);
        }
        return;
      }
      bargeinStreak = 0;

      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      try { audioWs.send(pcm.buffer); } catch (err) {}
    };
    audioCaptureReady = true;
  } catch (e) { console.error('[STT] capture fail', e); }
}

async function handleServerTranscript(raw) {
  if (muted) return;
  const text = (raw || '').trim();
  if (!text) return;
  // Clear any lingering partial text
  if (partialTextEl) { partialTextEl.classList.remove('active'); partialTextEl.textContent = ''; }
  const clean = cleanPunct(text);
  if (!sessionActive) {
    // A bare "Hey Jarvis" wakes the assistant (previously it was thrown away here).
    const wk = matchWakeStrict(text);
    if (wk.matched && !wk.command) { showDebug(text, 'heard'); startSession(); return; }
  } else if (clean === 'hey jarvis' || clean === 'jarvis') return;
  const now = performance.now();
  if (speaking) {
    const ec = isEcho(text);
    if (ec.echo) { showDebug(`"${text}" sim=${ec.sim.toFixed(2)}`, 'echo'); return; }
    if (!containsWakeWord(text)) { showDebug(`"${text}" ignored`, 'rejected'); return; }
    beep(1200, 0.08); cancelAllSpeech();
  } else if (now - lastCommandTime < COMMAND_COOLDOWN_MS) { showDebug(text + ' cooldown', 'rejected'); return; }
  const words = cleanPunct(text).split(' ').filter(Boolean);
  if (words.length < (window.__jvInterpreting || (window.__jvShortOk && window.__jvShortOk(text)) ? 1 : MIN_WORDS)) { showDebug(`"${text}" too short`, 'rejected'); return; }
  const ec = !speaking ? isEcho(text) : { echo: false };
  if (ec.echo) { showDebug(`"${text}" sim=${ec.sim.toFixed(2)}`, 'echo'); return; }
  if (sessionActive) {
    showDebug(text, 'heard');
    armSessionSilenceTimer();
    if (hasEndPhrase(text)) { await handleCommand(text); endSession(); return; }
    await handleCommand(text);
    return;
  }
  const { matched, command } = matchWakeStrict(text);
  if (!matched) { return; }   // idle chatter: ignore silently
  showDebug(text, 'heard');
  startSession();
  if (command) {
    if (hasEndPhrase(command)) { await handleCommand(command); endSession(); }
    else { await handleCommand(command); }
  } else { armSessionSilenceTimer(); }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ECHO_STOP = new Set('the and you your for are was this that with now can let know like anything else what have not but its just'.split(' '));   // common words: a command that shares only these with his reply isn't an echo

  const now = performance.now();
  recentJarvisReplies = recentJarvisReplies.filter(r => now - r.time < ECHO_MEMORY_MS);
  for (const r of recentJarvisReplies) { const sim = similarity(transcript, r.text); if (sim >= ECHO_SIMILARITY_THRESHOLD) return { echo: true, sim }; }
  return { echo: false };
}
function rememberJarvisReply(text) {
  if (!text || text.length < 3) return;
  recentJarvisReplies.push({ text, time: performance.now() });
  if (recentJarvisReplies.length > 10) recentJarvisReplies.shift();
}
function cleanPunct(s) { return s.toLowerCase().replace(/[.,!?;:]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function matchWakeStrict(text) {
  const words = cleanPunct(text).split(' ').filter(Boolean);
  if (!words.length) return { matched: false, command: '' };
  for (let i = 0; i < Math.min(2, words.length); i++) {
    const w = words[i].replace(/[^a-z]/g, '');
    if (WAKE_WORDS.includes(w)) return { matched: true, command: words.slice(i + 1).join(' ').trim() };
  }
  if (words.length >= 2 && HEY_WORDS.includes(words[0]) && LOOSE_WAKE.includes(words[1].replace(/[^a-z]/g, ''))) {
    return { matched: true, command: words.slice(2).join(' ').trim() };
  }
  return { matched: false, command: '' };
}
function containsWakeWord(text) {
  const lower = text.toLowerCase();
  for (const w of WAKE_WORDS) if (lower.includes(w.replace('.', ''))) return true;
  return false;
}
function hasEndPhrase(text) { if (window.__jvInterpreting) return false; const t = cleanPunct(text); return END_PHRASES.some(p => t.includes(p)); }
function armSessionSilenceTimer() {
  if (sessionSilenceTimer) clearTimeout(sessionSilenceTimer);
  if (SESSION_SILENCE_MS <= 0) return;
  sessionSilenceTimer = setTimeout(() => { if (sessionActive) { addMsg('— Session timed out —', 'sys'); endSession(); } }, (window.__jvSessionMs || SESSION_SILENCE_MS));
}
function startRecognition() {
  if (!recognition || recognizing || !active || muted) return;
  if (serverSttAvailable) return;
  try { recognition.start(); recognizing = true; linkStatus.textContent = 'ONLINE'; }
  catch (e) { setTimeout(() => { recognizing = false; startRecognition(); }, 500); }
}
recognition && (recognition.onstart = () => { recognizing = true; linkStatus.textContent = 'ONLINE'; audioStatus.textContent = sessionActive ? 'SESSION' : 'STANDBY'; });
recognition && (recognition.onend = () => {
  recognizing = false;
  if (active && !muted && !serverSttAvailable) setTimeout(startRecognition, 100);
  else { linkStatus.textContent = muted ? 'MUTED' : (serverSttAvailable ? 'ONLINE' : 'OFFLINE'); audioStatus.textContent = muted ? 'MUTED' : (sessionActive ? 'SESSION' : 'IDLE'); }
});
recognition && (recognition.onerror = (e) => {
  if (e.error === 'no-speech' || e.error === 'aborted') return;
  if (e.error === 'not-allowed') { addMsg('Microphone permission denied.', 'sys'); active = false; initBtn.style.display = 'inline-block'; initBtn.textContent = 'INITIALIZE'; }
});
recognition && (recognition.onresult = async (event) => {
  if (serverSttAvailable) return;
  if (muted) return;
  const last = event.results[event.results.length - 1];
  const result = last[0];
  const transcript = (result.transcript || '').trim();
  if (!transcript || !last.isFinal) return;
  await handleServerTranscript(transcript);
});

async function startSession() {
  sessionActive = true;
  beepWake(); setState('session');
  audioStatus.textContent = 'SESSION';
  addMsg('— Session started —', 'sys');
  armSessionSilenceTimer();
  sessionCount++;

  if (!currentUser) identifyUser().catch(() => {});   // in the background; never hold the session for the camera

  if (window.JARVIS_NATIVE || Date.now() - lastGreetAt < GREET_EVERY_MS) { speaking = false; setState('session'); armSessionSilenceTimer(); return; }
  lastGreetAt = Date.now();

  const user = currentUser;
  const myId = ++commandId;
  const params = new URLSearchParams();
  if (user && user.name) {
    params.set('name', user.name);
    if (user.title) params.set('title', user.title);
  }
  const url = params.toString() ? `/greeting?${params.toString()}` : '/greeting';

  fetch(url).then(r => r.json()).then(async (d) => {
    if (myId !== commandId) return;
    if (!d.text) { speaking = false; if (sessionActive && active && !muted) { setState('session'); armSessionSilenceTimer(); } return; }
    addMsg(d.text, 'jarvis');
    rememberJarvisReply(d.text);
    bargeAbort = new AbortController(); speakChain = Promise.resolve();
    enqueueSpeech(d.text);
    try { await speakChain; } catch (e) {}
    if (myId !== commandId) return;
    speaking = false;
    if (sessionActive && active && !muted) { setState('session'); armSessionSilenceTimer(); }
  }).catch(() => { speaking = false; if (sessionActive && active && !muted) { setState('session'); armSessionSilenceTimer(); } });
}
function endSession() {
  sessionActive = false; beepEnd(); addMsg('— Session ended —', 'sys');
  if (sessionSilenceTimer) { clearTimeout(sessionSilenceTimer); sessionSilenceTimer = null; }
  if (active && !muted) { setState('standby'); audioStatus.textContent = 'STANDBY'; }
}

async function handleCommand(text) {
  const myId = ++commandId;
  cancelAllSpeech();
  bargeAbort = new AbortController();
  speakChain = Promise.resolve();
  let cleaned = text;
  const w = WAKE_WORDS.map(k => k.replace('.', '')).join('|');
  cleaned = cleaned.replace(new RegExp(`\\b(hey |ok |hi )?(${w})\\b`, 'gi'), '').trim();
  cleaned = cleaned.replace(/^[\s,.\-!?]+/, '').trim();
  if (!cleaned) {
    if (sessionActive) { setState('session'); armSessionSilenceTimer(); } else if (active && !muted) { setState('standby'); }
    return;
  }
  addMsg(cleaned, 'user'); setState('thinking');
  lastCommandTime = performance.now();
  const tStart = performance.now();
  let fullReply = "", firstSentence = true;
  jarvisMsgEl = null;
  try {
    const response = await fetch('/chat_stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cleaned }), signal: bargeAbort.signal,
    });
    if (!response.ok || !response.body) throw new Error('stream failed');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (myId !== commandId) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const frames = sseBuffer.split('\n\n');
      sseBuffer = frames.pop();
      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data:')) continue;
        let evt; try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (evt.type === 'sentence') {
          fullReply += (fullReply ? ' ' : '') + evt.text;
          appendJarvisSentence(evt.text);
          rememberJarvisReply(evt.text);
          if (firstSentence) { latencyEl.textContent = `${Math.round(performance.now() - tStart)}ms`; firstSentence = false; }
          enqueueSpeech(evt.text);
        }
      }
    }
  } catch (e) { if (e.name !== 'AbortError') { console.error('[STREAM]', e); if (!fullReply) addMsg("Neural link unstable. Please repeat.", 'jarvis'); } }
  if (myId !== commandId) return;
  if (fullReply) rememberJarvisReply(fullReply);
  try { await speakChain; } catch (e) {}
  if (myId !== commandId) return;
  speaking = false;
  if (active && !muted) { if (sessionActive) { setState('session'); armSessionSilenceTimer(); } else { setState('standby'); } }
}

function appendJarvisSentence(text) {
  if (!jarvisMsgEl) {
    jarvisMsgEl = document.createElement('div');
    jarvisMsgEl.className = 'msg jarvis';
    jarvisMsgEl.innerHTML = `<span class="who">JARVIS</span><span class="body"></span>`;
    logEl.appendChild(jarvisMsgEl);
  }
  const body = jarvisMsgEl.querySelector('.body');
  body.textContent += (body.textContent ? ' ' : '') + text;
  logEl.scrollTop = logEl.scrollHeight;
  if (nav) { try { nav.caption(body.textContent, 'jarvis'); } catch (e) {} }
}

function fetchTts(text, signal) {
  return fetch('/speak', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, voice: currentVoice }), signal,
  }).catch(() => null);
}

function enqueueSpeech(text) {
  const signal = bargeAbort ? bargeAbort.signal : null;
  // Start synthesising right now, not when the previous sentence finishes: no gaps between sentences.
  const pre = signal ? fetchTts(text, signal) : null;
  speakChain = speakChain.then(() => playSpeechChunk(text, pre, signal)).catch(() => {});
  return speakChain;
}

async function playSpeechChunk(text, pre, sig) {
  if (!bargeAbort || muted) return;
  const signal = sig || bargeAbort.signal;
  if (signal.aborted) return;               // belongs to a reply the user already interrupted
  speaking = true; setState('speaking');
  audioStatus.textContent = 'PAUSED'; ttsStatus.textContent = 'ACTIVE';
  const ttsPromise = pre || fetchTts(text, signal);
  try {
    const r = await ttsPromise;
    if (signal.aborted) return;
    if (!r || r.status === 204) { await browserSpeak(text); return; }
    const blob = await r.blob();
    if (signal.aborted) return;
    const audio = new Audio(URL.createObjectURL(blob));
    currentAudio = audio;
    if (performance.now() < bargeDuckUntil) audio.volume = 0.2;
    await new Promise(resolve => { audio.onended = resolve; audio.onerror = resolve; audio.play().catch(resolve); });
  } catch (e) {} finally {
    if (currentAudio) currentAudio = null;
    ttsStatus.textContent = 'READY';
    if (!signal.aborted) await new Promise(r => setTimeout(r, POST_TTS_DELAY_MS));
  }
}

function cancelAllSpeech() {
  if (bargeAbort) { try { bargeAbort.abort(); } catch (e) {} bargeAbort = null; }
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} currentAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  speakChain = Promise.resolve(); speaking = false; bargeDuckUntil = 0;
  stopGuidance();
}

function browserSpeak(text) {
  return new Promise(resolve => {
    if (muted) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = TTS_RATE; u.pitch = TTS_PITCH;
    u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

// ---------------------------------------------------------------- navigation (face <-> map)
// nav.js is loaded on demand. If it ever fails, Jarvis still works; only the map screen is missing.
var nav = null, navQueue = [], navLoading = false;
function navMessage(m) {
  if (nav) { nav.handle(m); return; }
  navQueue.push(m);
  if (navLoading) return;
  navLoading = true;
  import('/nav.js').then(mod => {
    nav = mod.createNav({ say: guidanceSay });
    const q = navQueue; navQueue = [];
    q.forEach(x => { try { nav.handle(x); } catch (e) { console.warn('[NAV]', e); } });
  }).catch(e => {
    navLoading = false; navQueue = [];
    console.error('[NAV] could not load nav.js', e);
    addMsg('The map screen could not load. Voice commands still work.', 'sys');
  });
}

var guideSpeaking = false, guideAbort = null, guideAudio = null, guideChain = Promise.resolve(), guidePending = 0;
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
function stopGuidance() {
  if (guideAbort) { try { guideAbort.abort(); } catch (e) {} }
  if (guideAudio) { try { guideAudio.pause(); } catch (e) {} guideAudio = null; }
  guideAbort = null;
}
// Turn-by-turn prompts. They wait politely for Jarvis to finish an answer, play without the mic hearing them,
// and an old prompt is dropped rather than read out late ("turn left" after you've already turned).
function guidanceSay(text, opts = {}) {
  if (!text || muted || !active) return;
  const urgent = !!opts.urgent, queuedAt = performance.now();
  if (!urgent && guidePending >= 2) return;
  guidePending++;
  guideChain = guideChain.then(async () => {
    try {
      while ((speaking && !guideSpeaking) || appState === 'thinking') {
        if (performance.now() - queuedAt > (urgent ? 20000 : 6000)) return;
        await sleepMs(150);
      }
      if (!urgent && performance.now() - queuedAt > 8000) return;
      if (muted) return;
      guideAbort = new AbortController(); const sig = guideAbort.signal;
      guideSpeaking = true; speaking = true;
      if (appState === 'standby' || appState === 'session') setState('speaking');
      try { rememberJarvisReply(text); } catch (e) {}
      const r = await fetchTts(text, sig);
      if (sig.aborted) return;
      if (!r || r.status === 204) { await browserSpeak(text); return; }
      const blob = await r.blob();
      if (sig.aborted) return;
      const audio = new Audio(URL.createObjectURL(blob)); guideAudio = audio;
      await new Promise(res => { audio.onended = res; audio.onerror = res; audio.play().catch(res); });
    } catch (e) {} finally {
      guidePending = Math.max(0, guidePending - 1);
      if (guideSpeaking) {
        guideSpeaking = false; guideAudio = null;
        if (!guideAbort || !guideAbort.signal.aborted) {
          speaking = false;
          if (appState === 'speaking') { if (sessionActive) setState('session'); else if (active && !muted) setState('standby'); }
        }
      }
    }
  });
}

async function initialize() {
  try {
    if (window.JARVIS_NATIVE_MIC) { connectAudioWs(); }       // phone: native mic + on-device wake word
    else {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { autoGainControl: true, echoCancellation: true, noiseSuppression: true } });
    await setupMicAnalyser(micStream);
    startMicLevelLoop();
    connectAudioWs();
    await setupAudioCapture(micStream);
    }
    setTimeout(() => {
      if (!serverSttAvailable && active && !muted) { console.log('[STT] fallback'); startRecognition(); }
    }, 4000);
  } catch (e) { addMsg('Microphone access denied.', 'sys'); return false; }
  active = true;
  initBtn.style.display = 'none';
  setState('standby'); audioStatus.textContent = 'STANDBY';
  addMsg('Jarvis online.', 'sys');

  loadCachedUser();
  identifyUser().catch(() => {});
  fetch('/delivery/plan').then(r => r.json()).then(renderRoute).catch(() => {});
  setTimeout(() => navMessage({ cmd: 'cfg', cfg: {} }), 1500);        // loads the map module and asks for GPS once
  return true;
}

initBtn.addEventListener('click', async () => { await initialize(); });
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('active', muted);
  muteBtn.textContent = muted ? 'UNMUTE' : 'MUTE';
  if (muted) {
    cancelAllSpeech(); endSession();
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    setState('muted'); audioStatus.textContent = 'MUTED'; linkStatus.textContent = 'MUTED';
  } else {
    if (active) { setState('standby'); audioStatus.textContent = 'STANDBY'; if (!serverSttAvailable) startRecognition(); }
  }
});

window.addEventListener('load', async () => {
  setState('idle');
  try {
    const ok = await initialize();
    if (!ok) { initBtn.style.display = 'inline-block'; initBtn.textContent = 'INITIALIZE'; }
  } catch (e) {
    addMsg('Click INITIALIZE to grant microphone access.', 'sys');
    initBtn.style.display = 'inline-block'; initBtn.textContent = 'INITIALIZE'; setState('idle');
  }
});

clearBtn.addEventListener('click', () => { logEl.innerHTML = ''; });

// ---------- audio unlock ----------
// Chrome/Edge keep audio suspended on a freshly opened page until the user clicks once.
// Without this Jarvis can wake but stay silent, and the idle mic stream never starts.
const activateHint = document.getElementById('activate');
function audioIsLocked() {
  if ([audioCtx, audioCaptureCtx].some(c => c && c.state === 'suspended')) return true;
  return !!(navigator.userActivation && !navigator.userActivation.hasBeenActive);
}
function refreshActivateHint() { activateHint.classList.toggle('show', audioIsLocked()); }
async function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch (e) {}
  try { if (audioCaptureCtx) await audioCaptureCtx.resume(); } catch (e) {}
  try { speechSynthesis.getVoices(); } catch (e) {}
  refreshActivateHint();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlockAudio, { capture: true }));
setInterval(refreshActivateHint, 1000);

// ---------- delivery route panel ----------
const routePanel = document.getElementById('route-panel');
const routeHead = document.getElementById('route-head');
const routeStops = document.getElementById('route-stops');
const routeWarn = document.getElementById('route-warn');
let lastRoute = null;

function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function renderRoute(plan) {
  lastRoute = (plan && plan.stops && plan.stops.length) ? plan : null;
  if (!lastRoute) { routePanel.classList.remove('show'); return; }
  routePanel.classList.add('show');
  routeHead.textContent = '';
  routeHead.appendChild(mk('span', '', `${plan.orders >= 4 ? '4 orders (full)' : plan.orders + ' of 4 orders'} · ${plan.total_min} min · ${plan.total_miles} ${plan.unit || 'mi'}`));
  if (plan.payout) {
    routeHead.appendChild(document.createElement('br'));
    routeHead.appendChild(mk('span', 'money', `${plan.currency || '$'}${plan.payout.toFixed(2)}` + (plan.per_hour ? ` · ${plan.currency || '$'}${Math.round(plan.per_hour)} an hour` : '')));
  }
  if (plan.total_min_hi) {
    routeHead.appendChild(document.createElement('br'));
    routeHead.appendChild(mk('span', plan.risk === 'low' ? 'money' : 'est', `${plan.total_min_lo}–${plan.total_min_hi} min · on-time risk ${String(plan.risk || 'low')}`));
  }
  if (plan.source === 'estimate') { routeHead.appendChild(document.createElement('br')); routeHead.appendChild(mk('span', 'est', 'Estimated times')); }
  routeStops.textContent = '';
  plan.stops.forEach((s, i) => {
    const d = mk('div', `rs ${s.kind}${i === 0 ? ' first' : ''}`);
    const row = mk('div', 'row');
    row.appendChild(mk('span', 't', s.eta_clock));
    row.appendChild(mk('span', 'k', s.kind === 'pickup' ? 'Pick up' : 'Drop off'));
    row.appendChild(mk('span', 'n', s.kind === 'pickup' ? s.restaurant : s.short_addr));
    d.appendChild(row);
    const bits = [];
    if (s.kind === 'pickup') bits.push(s.platform + ' · ' + s.short_addr);
    else bits.push(s.restaurant + ' · ' + s.platform);
    if (s.eta_lo && s.eta_hi) bits.push(`${s.eta_lo}-${s.eta_hi}`);
    if (s.wait_min >= 2) bits.push(`wait ${s.wait_min}m`);
    if (s.kind === 'drop' && s.risk && s.risk !== 'low') bits.push(`risk ${s.risk}`);
    const sub = mk('div', 'sub', bits.join(' · '));
    if (s.late_min >= 2) sub.appendChild(mk('span', 'bad', ` · LATE ${s.late_min}m`));
    d.appendChild(sub);
    routeStops.appendChild(d);
  });
  routeWarn.textContent = (plan.warnings || []).slice(0, 3).join(' ');
}
