    }
    await new Promise(r => setTimeout(r, 700));

async function setupAudioCapture(stream) {
  if (audioCaptureReady) return;
  try {
    audioCaptureCtx = new AudioContext({ sampleRate: 16000 });
    const src = audioCaptureCtx.createMediaStreamSource(stream);
    const proc = audioCaptureCtx.createScriptProcessor(2048, 1, 1);
    const mute = audioCaptureCtx.createGain(); mute.gain.value = 0;
    proc.connect(mute); mute.connect(audioCaptureCtx.destination); src.connect(proc);

    let bargeinStreak = 0;
    proc.onaudioprocess = (e) => {
      if (muted) return;   // stream mic to Whisper even while idle so 'Hey Jarvis' is heard by the browser too
      if (!audioWs || audioWs.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);

      if (speaking) {
        if (guideSpeaking) return;          // road noise must not cut off turn-by-turn prompts; the wake word still does
        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        const rms = Math.sqrt(sum / input.length) * 32768;
        if (rms > BARGE_RMS) {
          bargeinStreak++;
          if (bargeinStreak >= BARGE_FRAMES) {
            beep(1200, 0.08);
            cancelAllSpeech();
            bargeinStreak = 0;
          }
        } else {
          bargeinStreak = Math.max(0, bargeinStreak - 1);
        }
        return;
      }
      bargeinStreak = 0;

      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      try { audioWs.send(pcm.buffer); } catch (err) {}
    };
    audioCaptureReady = true;
  } catch (e) { console.error('[STT] capture fail', e); }
}

async function handleServerTranscript(raw) {
  if (muted) return;
  const text = (raw || '').trim();
  if (!text) return;
  // Clear any lingering partial text
  if (partialTextEl) { partialTextEl.classList.remove('active'); partialTextEl.textContent = ''; }
  const clean = cleanPunct(text);
  if (!sessionActive) {
    // A bare "Hey Jarvis" wakes the assistant (previously it was thrown away here).
    const wk = matchWakeStrict(text);
    if (wk.matched && !wk.command) { showDebug(text, 'heard'); startSession(); return; }
  } else if (clean === 'hey jarvis' || clean === 'jarvis') return;
  const now = performance.now();
  if (speaking) {
    const ec = isEcho(text);
    if (ec.echo) { showDebug(`"${text}" sim=${ec.sim.toFixed(2)}`, 'echo'); return; }
    if (!containsWakeWord(text)) { showDebug(`"${text}" ignored`, 'rejected'); return; }
    beep(1200, 0.08); cancelAllSpeech();
  } else if (now - lastCommandTime < COMMAND_COOLDOWN_MS) { showDebug(text + ' cooldown', 'rejected'); return; }
  const words = cleanPunct(text).split(' ').filter(Boolean);
  if (words.length < MIN_WORDS) { showDebug(`"${text}" too short`, 'rejected'); return; }
  const ec = !speaking ? isEcho(text) : { echo: false };
  if (ec.echo) { showDebug(`"${text}" sim=${ec.sim.toFixed(2)}`, 'echo'); return; }
  if (sessionActive) {
    showDebug(text, 'heard');
    armSessionSilenceTimer();
    if (hasEndPhrase(text)) { await handleCommand(text); endSession(); return; }
    await handleCommand(text);
    return;
  }
  const { matched, command } = matchWakeStrict(text);
  if (!matched) { return; }   // idle chatter: ignore silently
  showDebug(text, 'heard');
  startSession();
  if (command) {
    if (hasEndPhrase(command)) { await handleCommand(command); endSession(); }
    else { await handleCommand(command); }
  } else { armSessionSilenceTimer(); }
}

const WAKE_WORDS = ['jarvis','jervis','jarvas','javis','charvis','jarvis.'];
const LOOSE_WAKE = ['travis','jarvus','harvis','garvis','jarvice','jarves'];   // common mishearings, only accepted after hey/hi/ok
const HEY_WORDS = ['hey','hi','ok','okay','hay'];
const END_PHRASES = ['thank you','thanks jarvis','thank you jarvis','goodbye jarvis','good bye jarvis','bye jarvis',"that's all","that's it",'we are done',"we're done",'stop listening'];

const BARGE_RMS = 1800, BARGE_FRAMES = 3;
// Greet out loud only after you've been away a while; otherwise just chime and listen (no waiting through a greeting).

let debugTimer = null;
function showDebug(text, kind) {
  const labels = { heard: 'HEARD', rejected: 'REJECTED', echo: 'ECHO-DROP' };
  debugEl.innerHTML = `<span class="${kind}">${labels[kind]}:</span> ${escapeHtml(text)}`;
  debugEl.classList.add('active');

}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ECHO_STOP = new Set('the and you your for are was this that with now can let know like anything else what have not but its just'.split(' '));   // common words: a command that shares only these with his reply isn't an echo
function wordSet(s) { return new Set(cleanPunct(s).split(' ').filter(w => w.length > 2 && !ECHO_STOP.has(w))); }
function similarity(a, b) {
  const wa = wordSet(a), wb = wordSet(b);

  let o = 0; for (const w of wa) if (wb.has(w)) o++;
  return o / wa.size;   // how much of what was heard is in his reply: an echo is his words; a command shares a word or two at most
}

  for (const r of recentJarvisReplies) { const sim = similarity(transcript, r.text); if (sim >= ECHO_SIMILARITY_THRESHOLD) return { echo: true, sim }; }

}
function rememberJarvisReply(text) {

}

  }

}
function endSession() {
  sessionActive = false; beepEnd(); addMsg('— Session ended —', 'sys');
  if (sessionSilenceTimer) { clearTimeout(sessionSilenceTimer); sessionSilenceTimer = null; }
  if (active && !muted) { setState('standby'); audioStatus.textContent = 'STANDBY'; }
}

async function handleCommand(text) {
  const myId = ++commandId;
  cancelAllSpeech();
  bargeAbort = new AbortController();
  speakChain = Promise.resolve();
  let cleaned = text;
  const w = WAKE_WORDS.map(k => k.replace('.', '')).join('|');
  cleaned = cleaned.replace(new RegExp(`\\b(hey |ok |hi )?(${w})\\b`, 'gi'), '').trim();
  cleaned = cleaned.replace(/^[\s,.\-!?]+/, '').trim();
  if (!cleaned) {
    if (sessionActive) { setState('session'); armSessionSilenceTimer(); } else if (active && !muted) { setState('standby'); }
    return;
  }
  addMsg(cleaned, 'user'); setState('thinking');
  lastCommandTime = performance.now();
  const tStart = performance.now();
  let fullReply = "", firstSentence = true;
  jarvisMsgEl = null;
  try {
    const response = await fetch('/chat_stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cleaned }), signal: bargeAbort.signal,
    });
    if (!response.ok || !response.body) throw new Error('stream failed');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (myId !== commandId) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const frames = sseBuffer.split('\n\n');
      sseBuffer = frames.pop();
      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data:')) continue;
        let evt; try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (evt.type === 'sentence') {
          fullReply += (fullReply ? ' ' : '') + evt.text;
          appendJarvisSentence(evt.text);
          rememberJarvisReply(evt.text);
          if (firstSentence) { latencyEl.textContent = `${Math.round(performance.now() - tStart)}ms`; firstSentence = false; }
          enqueueSpeech(evt.text);
        }
      }
    }
  } catch (e) { if (e.name !== 'AbortError') { console.error('[STREAM]', e); if (!fullReply) addMsg("Neural link unstable. Please repeat.", 'jarvis'); } }
  if (myId !== commandId) return;
  if (fullReply) rememberJarvisReply(fullReply);
  try { await speakChain; } catch (e) {}
  if (myId !== commandId) return;
  speaking = false;
  if (active && !muted) { if (sessionActive) { setState('session'); armSessionSilenceTimer(); } else { setState('standby'); } }
}

function appendJarvisSentence(text) {
  if (!jarvisMsgEl) {
    jarvisMsgEl = document.createElement('div');
    jarvisMsgEl.className = 'msg jarvis';
    jarvisMsgEl.innerHTML = `<span class="who">JARVIS</span><span class="body"></span>`;
    logEl.appendChild(jarvisMsgEl);
  }
  const body = jarvisMsgEl.querySelector('.body');
  body.textContent += (body.textContent ? ' ' : '') + text;
  logEl.scrollTop = logEl.scrollHeight;
  if (nav) { try { nav.caption(body.textContent, 'jarvis'); } catch (e) {} }
}

function fetchTts(text, signal) {
  return fetch('/speak', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, voice: currentVoice }), signal,
  }).catch(() => null);
}

function enqueueSpeech(text) {
  const signal = bargeAbort ? bargeAbort.signal : null;
  // Start synthesising right now, not when the previous sentence finishes: no gaps between sentences.
  const pre = signal ? fetchTts(text, signal) : null;
  speakChain = speakChain.then(() => playSpeechChunk(text, pre, signal)).catch(() => {});
  return speakChain;
}

async function playSpeechChunk(text, pre, sig) {
  if (!bargeAbort || muted) return;
  const signal = sig || bargeAbort.signal;
  if (signal.aborted) return;               // belongs to a reply the user already interrupted
  speaking = true; setState('speaking');
  audioStatus.textContent = 'PAUSED'; ttsStatus.textContent = 'ACTIVE';
  const ttsPromise = pre || fetchTts(text, signal);
  try {
    const r = await ttsPromise;
    if (signal.aborted) return;
    if (!r || r.status === 204) { await browserSpeak(text); return; }
    const blob = await r.blob();
    if (signal.aborted) return;
    const audio = new Audio(URL.createObjectURL(blob));
    currentAudio = audio;
    if (performance.now() < bargeDuckUntil) audio.volume = 0.2;
    await new Promise(resolve => { audio.onended = resolve; audio.onerror = resolve; audio.play().catch(resolve); });
  } catch (e) {} finally {
    if (currentAudio) currentAudio = null;
    ttsStatus.textContent = 'READY';
    if (!signal.aborted) await new Promise(r => setTimeout(r, POST_TTS_DELAY_MS));
  }
}

function cancelAllSpeech() {
  if (bargeAbort) { try { bargeAbort.abort(); } catch (e) {} bargeAbort = null; }
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} currentAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  speakChain = Promise.resolve(); speaking = false; bargeDuckUntil = 0;
  stopGuidance();
}

function browserSpeak(text) {
  return new Promise(resolve => {
    if (muted) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = TTS_RATE; u.pitch = TTS_PITCH;
    u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

// ---------------------------------------------------------------- navigation (face <-> map)
// nav.js is loaded on demand. If it ever fails, Jarvis still works; only the map screen is missing.
var nav = null, navQueue = [], navLoading = false;
function navMessage(m) {
  if (nav) { nav.handle(m); return; }
  navQueue.push(m);
  if (navLoading) return;
  navLoading = true;
  import('/nav.js').then(mod => {
    nav = mod.createNav({ say: guidanceSay });
    const q = navQueue; navQueue = [];
    q.forEach(x => { try { nav.handle(x); } catch (e) { console.warn('[NAV]', e); } });
  }).catch(e => {
    navLoading = false; navQueue = [];
    console.error('[NAV] could not load nav.js', e);
    addMsg('The map screen could not load. Voice commands still work.', 'sys');
  });
}

var guideSpeaking = false, guideAbort = null, guideAudio = null, guideChain = Promise.resolve(), guidePending = 0;
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
function stopGuidance() {
  if (guideAbort) { try { guideAbort.abort(); } catch (e) {} }
  if (guideAudio) { try { guideAudio.pause(); } catch (e) {} guideAudio = null; }
  guideAbort = null;
}
// Turn-by-turn prompts. They wait politely for Jarvis to finish an answer, play without the mic hearing them,
// and an old prompt is dropped rather than read out late ("turn left" after you've already turned).
function guidanceSay(text, opts = {}) {
  if (!text || muted || !active) return;
  const urgent = !!opts.urgent, queuedAt = performance.now();
  if (!urgent && guidePending >= 2) return;
  guidePending++;
  guideChain = guideChain.then(async () => {
    try {
      while ((speaking && !guideSpeaking) || appState === 'thinking') {
        if (performance.now() - queuedAt > (urgent ? 20000 : 6000)) return;
        await sleepMs(150);
      }
      if (!urgent && performance.now() - queuedAt > 8000) return;
      if (muted) return;
      guideAbort = new AbortController(); const sig = guideAbort.signal;
      guideSpeaking = true; speaking = true;
      if (appState === 'standby' || appState === 'session') setState('speaking');
      try { rememberJarvisReply(text); } catch (e) {}
      const r = await fetchTts(text, sig);
      if (sig.aborted) return;
      if (!r || r.status === 204) { await browserSpeak(text); return; }
      const blob = await r.blob();
      if (sig.aborted) return;
      const audio = new Audio(URL.createObjectURL(blob)); guideAudio = audio;
      await new Promise(res => { audio.onended = res; audio.onerror = res; audio.play().catch(res); });
    } catch (e) {} finally {
      guidePending = Math.max(0, guidePending - 1);
      if (guideSpeaking) {
        guideSpeaking = false; guideAudio = null;
        if (!guideAbort || !guideAbort.signal.aborted) {
          speaking = false;
          if (appState === 'speaking') { if (sessionActive) setState('session'); else if (active && !muted) setState('standby'); }
        }
      }
    }
  });
}

async function initialize() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { autoGainControl: true, echoCancellation: true, noiseSuppression: true } });
    await setupMicAnalyser(micStream);
    startMicLevelLoop();
    connectAudioWs();
    await setupAudioCapture(micStream);
    setTimeout(() => {
      if (!serverSttAvailable && active && !muted) { console.log('[STT] fallback'); startRecognition(); }
    }, 4000);
  } catch (e) { addMsg('Microphone access denied.', 'sys'); return false; }
  active = true;
  initBtn.style.display = 'none';
  setState('standby'); audioStatus.textContent = 'STANDBY';
  addMsg('Jarvis online.', 'sys');

  loadCachedUser();
  identifyUser().catch(() => {});
  fetch('/delivery/plan').then(r => r.json()).then(renderRoute).catch(() => {});
  setTimeout(() => navMessage({ cmd: 'cfg', cfg: {} }), 1500);        // loads the map module and asks for GPS once
  return true;
}

initBtn.addEventListener('click', async () => { await initialize(); });
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('active', muted);
  muteBtn.textContent = muted ? 'UNMUTE' : 'MUTE';
  if (muted) {
    cancelAllSpeech(); endSession();
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    setState('muted'); audioStatus.textContent = 'MUTED'; linkStatus.textContent = 'MUTED';
  } else {
    if (active) { setState('standby'); audioStatus.textContent = 'STANDBY'; if (!serverSttAvailable) startRecognition(); }
  }
});

window.addEventListener('load', async () => {
  setState('idle');
  try {
    const ok = await initialize();
    if (!ok) { initBtn.style.display = 'inline-block'; initBtn.textContent = 'INITIALIZE'; }
  } catch (e) {
    addMsg('Click INITIALIZE to grant microphone access.', 'sys');
    initBtn.style.display = 'inline-block'; initBtn.textContent = 'INITIALIZE'; setState('idle');
  }
});

clearBtn.addEventListener('click', () => { logEl.innerHTML = ''; });

// ---------- audio unlock ----------
// Chrome/Edge keep audio suspended on a freshly opened page until the user clicks once.
// Without this Jarvis can wake but stay silent, and the idle mic stream never starts.
const activateHint = document.getElementById('activate');
function audioIsLocked() {
  if ([audioCtx, audioCaptureCtx].some(c => c && c.state === 'suspended')) return true;
  return !!(navigator.userActivation && !navigator.userActivation.hasBeenActive);
}
function refreshActivateHint() { activateHint.classList.toggle('show', audioIsLocked()); }
async function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch (e) {}
  try { if (audioCaptureCtx) await audioCaptureCtx.resume(); } catch (e) {}
  try { speechSynthesis.getVoices(); } catch (e) {}
  refreshActivateHint();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlockAudio, { capture: true }));
setInterval(refreshActivateHint, 1000);

// ---------- delivery route panel ----------
const routePanel = document.getElementById('route-panel');
const routeHead = document.getElementById('route-head');
const routeStops = document.getElementById('route-stops');
const routeWarn = document.getElementById('route-warn');
let lastRoute = null;

function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function renderRoute(plan) {
  lastRoute = (plan && plan.stops && plan.stops.length) ? plan : null;
  if (!lastRoute) { routePanel.classList.remove('show'); return; }
  routePanel.classList.add('show');
  routeHead.textContent = '';
  routeHead.appendChild(mk('span', '', `ROUTE · ${plan.orders} ORDER${plan.orders === 1 ? '' : 'S'} · ${plan.total_min} MIN · ${plan.total_miles} ${(plan.unit || 'mi').toUpperCase()}`));
  if (plan.payout) {
    routeHead.appendChild(document.createElement('br'));
    routeHead.appendChild(mk('span', 'money', `${plan.currency || '$'}${plan.payout.toFixed(2)}` + (plan.per_hour ? ` · ${plan.currency || '$'}${Math.round(plan.per_hour)}/HR` : '')));
  }
  if (plan.total_min_hi) {
    routeHead.appendChild(document.createElement('br'));
    routeHead.appendChild(mk('span', plan.risk === 'low' ? 'money' : 'est', `${plan.total_min_lo}-${plan.total_min_hi} MIN · ON-TIME RISK ${String(plan.risk || 'low').toUpperCase()}`));
  }
  if (plan.source === 'estimate') { routeHead.appendChild(document.createElement('br')); routeHead.appendChild(mk('span', 'est', 'ESTIMATED TIMES')); }
  routeStops.textContent = '';
  plan.stops.forEach((s, i) => {
    const d = mk('div', `rs ${s.kind}${i === 0 ? ' first' : ''}`);
    const row = mk('div', 'row');
    row.appendChild(mk('span', 't', s.eta_clock));
    row.appendChild(mk('span', 'k', s.kind === 'pickup' ? 'PICK' : 'DROP'));
    row.appendChild(mk('span', 'n', s.kind === 'pickup' ? s.restaurant : s.short_addr));
    d.appendChild(row);
    const bits = [];
    if (s.kind === 'pickup') bits.push(s.platform + ' · ' + s.short_addr);
    else bits.push(s.restaurant + ' · ' + s.platform);
    if (s.eta_lo && s.eta_hi) bits.push(`${s.eta_lo}-${s.eta_hi}`);
    if (s.wait_min >= 2) bits.push(`wait ${s.wait_min}m`);
    if (s.kind === 'drop' && s.risk && s.risk !== 'low') bits.push(`risk ${s.risk}`);
    const sub = mk('div', 'sub', bits.join(' · '));
    if (s.late_min >= 2) sub.appendChild(mk('span', 'bad', ` · LATE ${s.late_min}m`));
    d.appendChild(sub);
    routeStops.appendChild(d);
  });
  routeWarn.textContent = (plan.warnings || []).slice(0, 3).join(' ');
}

</script>
